<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var lang = localStorage.getItem("bwt-lang");
        if (lang === "es" || lang === "en") document.documentElement.lang = lang;
        var theme = localStorage.getItem("bwt-theme");
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f3a" />

  <title>Page not found · Brownsville Border Wait Times</title>
  <meta property="og:title" content="Page not found · Brownsville Border Wait Times" />
  <meta property="og:description" content="That page is missing. Live Brownsville bridge wait times are on the home page." />
  <meta property="og:image" content="https://eliseocab.github.io/brownsville-wait-times/images/og.png" />

  <link rel="stylesheet" href="/brownsville-wait-times/fonts/fonts.css?v=1" />
  <style>
    :root { --navy: #0b1f3a; --sky: #7dd3fc; --ink: #e8eef7; --muted: #9fb0c5; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: #0b1f3a;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }
    main { max-width: 28rem; text-align: center; }
    .kicker {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sky);
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      margin: 0.5rem 0 0.75rem;
    }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 1.4rem; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      background: #38bdf8;
      color: #041018;
      font-weight: 700;
      text-decoration: none;
    }
    a.btn:hover { background: #7dd3fc; }

    .skip-link {
      position: absolute;
      inset-inline-start: max(0.75rem, env(safe-area-inset-left, 0px));
      top: max(0.75rem, env(safe-area-inset-top, 0px));
      z-index: 10000;
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      background: #0b1f3a;
      color: #fff;
      font-weight: 750;
      font-size: 0.9rem;
      line-height: 1.2;
      text-decoration: none;
      white-space: nowrap;
      transform: translateY(-150%);
    }
    .skip-link:hover,
    .skip-link:focus,
    .skip-link:focus-visible {
      transform: translateY(0);
      color: #fff;
      text-decoration: none;
      outline: 2px solid #7dd3fc;
      outline-offset: 3px;
    }
    .skip-link .lang-es { display: none; }
    html[lang="es"] .skip-link .lang-en { display: none; }
    html[lang="es"] .skip-link .lang-es { display: inline; }
    #content { scroll-margin-top: 5rem; }
    #content:focus { outline: none; }
    #content:focus-visible {
      outline: 2px solid var(--sky-deep, #075985);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content"><span class="lang-en">Skip to content</span><span class="lang-es">Saltar al contenido</span></a>
  <main id="content" tabindex="-1">
    <div class="kicker">Brownsville wait times</div>
    <h1>This page is missing</h1>
    <p>Open the home page for live Brownsville–Matamoros wait times.</p>
    <a class="btn" href="/brownsville-wait-times/">View wait times</a>
  </main>
</body>
</html>
