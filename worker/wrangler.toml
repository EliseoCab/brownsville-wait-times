# Cloudflare Worker — live CBP RSS proxy for the GitHub Pages site
# Docs: https://developers.cloudflare.com/workers/
#
# First-time setup:
#   1. Create a free Cloudflare account: https://dash.cloudflare.com/sign-up
#   2. cd worker && npm install
#   3. npx wrangler login
#   4. npx wrangler deploy
#   5. Copy the workers.dev URL into index.html → FEED_PROXY_URL
#      (all-ports/ uses the same host + GET /all)

name = "brownsville-bwt"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Warm the edge cache every 5 min.
# Lag alarm kicks only at :10/:25/:40 (three per hour). */5 is cache warming only.
[triggers]
crons = ["*/5 * * * *", "10 * * * *", "25 * * * *", "40 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "brownsville-checkins"
database_id = "0117edea-be6c-4add-b42e-c503fec76844"
