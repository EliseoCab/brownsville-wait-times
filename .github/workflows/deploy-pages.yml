name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Data-only bot commits are deployed by "Update CBP wait times"
      - "data/**"
  workflow_dispatch:

# Code pushes also re-fetch CBP so we never overwrite Pages with stale data/bwt.xml

permissions:
  contents: read
  pages: write
  id-token: write

# Separate from bwt-update so data refreshes are not queued behind code deploys
concurrency:
  group: pages-code-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest CBP feed
        run: |
          mkdir -p data
          curl -fsSL \
            "https://bwt.cbp.gov/api/bwtRss/HTML/44,43/42,45,44,43/42,45,43" \
            -o data/bwt.xml
          grep -q "<item>" data/bwt.xml
          echo "Deploying feed:"
          grep -o '<pubDate>[^<]*' data/bwt.xml | head -1

      - name: Stage site files
        run: |
          mkdir -p _site/data _site/icons
          cp index.html README.md manifest.webmanifest sw.js _site/
          cp icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png _site/icons/
          cp data/bwt.xml _site/data/bwt.xml
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
