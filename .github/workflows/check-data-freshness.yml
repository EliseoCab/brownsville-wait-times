name: Check data freshness (lag alarm)  # EMAIL ALERTS CURRENTLY PAUSED - see Send step below

on:
  schedule:
    # :15, :30, and :45 only. Worker kicks the same minutes if this schedule stalls.
    - cron: "15,30,45 * * * *"
  # Cloudflare Worker also POSTs workflow_dispatch at :15/:30/:45 when
  # GITHUB_DISPATCH_TOKEN is set (backup if this Actions schedule stalls).
  workflow_dispatch:

# Compares live CBP vs GitHub Pages mirror (backup) PER Brownsville bridge.
# Uses each RSS item's Hours: line (America/Chicago); skips closed crossings
# plus a short post-close grace. Update Pending / missing hourly post:
# limited-hours wait 10 min after open; 24h bridges wait 10 min into the
# current hour (e.g. 11:00 am wait still pending at 12:10).
# The live page prefers the Cloudflare Worker; this alarm keeps the Actions
# mirror honest. Worker feed is logged only (not pass/fail).
# On lag detection: email notification is sent immediately.
# The regular updater (offset to :10/:25/:40) keeps the mirror fresh.
# Fires at :15/:30/:45.
#
# EMAIL ALERTS CURRENTLY PAUSED (see email step below).

permissions:
  contents: read
  actions: write

concurrency:
  group: lag-check
  cancel-in-progress: true

jobs:
  check-lag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare CBP feed vs live site mirror
        id: compare
        env:
          CBP_URL: "https://bwt.cbp.gov/api/bwtRss/HTML/44,43/42,45,44,43/42,45,43"
          SITE_URL: "https://eliseocab.github.io/brownsville-wait-times/data/bwt.xml"
          WORKER_URL: "https://brownsville-bwt.borderwait.workers.dev/?fresh=1"
          # Alert if an in-hours bridge lags CBP by this many minutes (one CBP hour + buffer)
          MAX_LAG_MINUTES: "75"
          # Skip freshness this long after official close (frozen last-open stamp)
          POST_CLOSE_GRACE_MINUTES: "45"
        run: |
          set -euo pipefail

          CBP_HTTP=$(curl -s -o /tmp/cbp.xml -w "%{http_code}" "$CBP_URL" || echo "000")
          SITE_HTTP=$(curl -s -o /tmp/site.xml -w "%{http_code}" "$SITE_URL" || echo "000")
          # Best-effort: worker is primary for the open page (not required for pass/fail)
          curl -fsSL --max-time 20 "$WORKER_URL" -o /tmp/worker.xml || true

          CBP_PUBDATE=$(sed -n 's/.*<pubDate>\(.*\)<\/pubDate>.*/\1/p' /tmp/cbp.xml | head -1 || echo "")

          export CBP_HTTP SITE_HTTP CBP_PUBDATE

          python3 scripts/compare_bwt.py \
            --mode compare \
            --cbp /tmp/cbp.xml \
            --site /tmp/site.xml \
            --worker /tmp/worker.xml \
            --max-lag "$MAX_LAG_MINUTES" \
            --grace "$POST_CLOSE_GRACE_MINUTES"

      - name: No lag detected
        if: steps.compare.outputs.lagging != 'true'
        run: |
          echo "All in-hours bridges are fresh enough (worst lag ~${{ steps.compare.outputs.lag_minutes }} min)."

      # EMAIL ALERTS PAUSED
      # To re-enable, change the condition back to: if: steps.compare.outputs.lagging == 'true'
      - name: Send immediate lag alert (PAUSED)
        if: 'false'  # PAUSED - see comment above
        env:
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD || secrets.GMAIL }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_BCC: ${{ secrets.ALERT_BCC }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_REPLY_TO: ${{ secrets.ALERT_REPLY_TO }}
          ALERT_SUBJECT: ${{ steps.compare.outputs.alert_subject }}
          ALERT_BODY: ${{ steps.compare.outputs.alert_body }}
        run: |
          echo "Email alerts are currently PAUSED. No email sent."
          # python3 scripts/send_alert_email.py
          # echo "::error::${ALERT_BODY}"
          # echo "${ALERT_BODY}"
          # exit 1
