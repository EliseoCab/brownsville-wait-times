name: Check data freshness (lag alarm)

on:
  schedule:
    # Every 15 minutes (GitHub cron can lag a few minutes)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Compares live CBP vs GitHub Pages mirror (backup). The live page prefers the
# Cloudflare Worker; this alarm keeps the Actions mirror honest.
# On lag: auto-run Update workflow, wait, re-check. Email only if still lagging.

permissions:
  contents: read
  actions: write

concurrency:
  group: lag-check
  cancel-in-progress: true

jobs:
  check-lag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare CBP feed vs live site mirror
        id: compare
        env:
          CBP_URL: "https://bwt.cbp.gov/api/bwtRss/HTML/44,43/42,45,44,43/42,45,43"
          SITE_URL: "https://eliseocab.github.io/brownsville-wait-times/data/bwt.xml"
          WORKER_URL: "https://brownsville-bwt.borderwait.workers.dev/?fresh=1"
          # Alert if site lags CBP by this many minutes (one CBP hour + small buffer)
          MAX_LAG_MINUTES: "75"
        run: |
          set -euo pipefail

          curl -fsSL "$CBP_URL" -o /tmp/cbp.xml
          curl -fsSL "$SITE_URL" -o /tmp/site.xml
          # Best-effort: worker is primary for the open page (not required for pass/fail)
          curl -fsSL --max-time 20 "$WORKER_URL" -o /tmp/worker.xml || true

          python3 scripts/compare_bwt.py \
            --mode compare \
            --cbp /tmp/cbp.xml \
            --site /tmp/site.xml \
            --worker /tmp/worker.xml \
            --max-lag "$MAX_LAG_MINUTES"

      - name: Auto-refresh when mirror is lagging
        if: steps.compare.outputs.lagging == 'true'
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Lag detected — starting Update CBP wait times…"
          BEFORE_IDS=$(gh run list --repo "${{ github.repository }}" \
            --workflow "Update CBP wait times" --limit 5 \
            --json databaseId --jq '[.[].databaseId] | join(",")' 2>/dev/null || echo "")
          gh workflow run "Update CBP wait times" --repo "${{ github.repository }}"

          # Wait for a *new* run id, then for it to finish (max ~6 min)
          sleep 8
          RUN_ID=""
          for i in $(seq 1 24); do
            # Prefer queued / in-progress
            RUN_ID=$(gh run list --repo "${{ github.repository }}" \
              --workflow "Update CBP wait times" --limit 5 \
              --json databaseId,status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting")] | .[0].databaseId // empty' 2>/dev/null || true)
            # Else newest id that was not already in the list before we triggered
            if [ -z "$RUN_ID" ]; then
              RUN_ID=$(gh run list --repo "${{ github.repository }}" \
                --workflow "Update CBP wait times" --limit 5 \
                --json databaseId \
                --jq --arg before "$BEFORE_IDS" '
                  def seen: ($before | split(","));
                  [.[] | select(($before == "") or ((.databaseId | tostring) as $id | (seen | index($id) | not)))]
                  | .[0].databaseId // empty
                ' 2>/dev/null || true)
            fi
            if [ -n "$RUN_ID" ]; then
              echo "Tracking run $RUN_ID"
              break
            fi
            sleep 3
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find update run id"
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Poll until completed or timeout
          ok=0
          for i in $(seq 1 36); do
            status=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" \
              --json status,conclusion --jq '"\(.status) \(.conclusion // "")"' 2>/dev/null || echo "unknown")
            echo "  [$i] $status"
            case "$status" in
              completed\ success)
                ok=1
                break
                ;;
              completed\ *)
                echo "Update run finished with: $status"
                break
                ;;
            esac
            sleep 10
          done

          if [ "$ok" = "1" ]; then
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
            # Pages CDN can lag a few seconds after deploy
            sleep 15
          else
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-check site after auto-refresh
        if: steps.compare.outputs.lagging == 'true'
        id: recheck
        env:
          CBP_URL: "https://bwt.cbp.gov/api/bwtRss/HTML/44,43/42,45,44,43/42,45,43"
          SITE_URL: "https://eliseocab.github.io/brownsville-wait-times/data/bwt.xml"
          MAX_LAG_MINUTES: "75"
        run: |
          set -euo pipefail
          curl -fsSL "$CBP_URL" -o /tmp/cbp2.xml
          # Bust any intermediary caches
          curl -fsSL "${SITE_URL}?t=$(date +%s)" -o /tmp/site2.xml || curl -fsSL "$SITE_URL" -o /tmp/site2.xml

          python3 scripts/compare_bwt.py \
            --mode recheck \
            --cbp /tmp/cbp2.xml \
            --site /tmp/site2.xml \
            --max-lag "$MAX_LAG_MINUTES"

      - name: Pass if mirror was fine or recovered
        if: steps.compare.outputs.lagging != 'true' || steps.recheck.outputs.still_lagging == 'false'
        run: |
          if [ "${{ steps.compare.outputs.lagging }}" = "true" ]; then
            echo "Self-healed: mirror was lagging (~${{ steps.compare.outputs.lag_minutes }} min) but Update CBP wait times fixed it."
            echo "::notice::Mirror was behind CBP; auto-refresh recovered. No action needed."
          else
            echo "Mirror is fresh (lag ~${{ steps.compare.outputs.lag_minutes }} min)."
          fi

      - name: Fail only if still lagging after auto-refresh
        if: steps.compare.outputs.lagging == 'true' && steps.recheck.outputs.still_lagging == 'true'
        run: |
          echo "::error::GitHub Pages data/bwt.xml is still ~${{ steps.recheck.outputs.lag_minutes || steps.compare.outputs.lag_minutes }} minutes behind CBP after auto-refresh."
          echo "Manual fix: Actions → Update CBP wait times → Run workflow"
          echo "Note: the live page may still be OK via Cloudflare Worker (Live · CBP proxy)."
          exit 1
