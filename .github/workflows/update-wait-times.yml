name: Update CBP wait times

on:
  schedule:
    # Every 10 minutes (GitHub cron can lag a few minutes)
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Always fetch CBP + deploy Pages in the same job.
# GITHUB_TOKEN pushes do not trigger other workflows.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CBP Brownsville feed
        run: |
          mkdir -p data
          curl -fsSL \
            "https://bwt.cbp.gov/api/bwtRss/HTML/44,43/42,45,44,43/42,45,43" \
            -o data/bwt.xml
          grep -q "<item>" data/bwt.xml
          echo "Feed size: $(wc -c < data/bwt.xml) bytes"
          echo "pubDate: $(grep -o '<pubDate>[^<]*' data/bwt.xml | head -1)"
          echo "Sample times:"
          grep -oE 'At [0-9:]+ [ap]m CDT|[0-9]+ min delay|Update Pending' data/bwt.xml | head -20

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bwt.xml
          if git diff --staged --quiet; then
            echo "No wait-time file changes to commit."
          else
            git commit -m "chore: refresh Brownsville CBP wait times"
            git push
            echo "Committed and pushed new data/bwt.xml"
          fi

      - name: Stage site files (always use freshly fetched feed)
        run: |
          mkdir -p _site
          cp index.html README.md _site/
          mkdir -p _site/data
          cp data/bwt.xml _site/data/bwt.xml
          touch _site/.nojekyll
          echo "Deploying feed:"
          grep -o '<pubDate>[^<]*' _site/data/bwt.xml | head -1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
