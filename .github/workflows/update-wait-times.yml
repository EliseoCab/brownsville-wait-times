name: Update CBP wait times

on:
  schedule:
    # Single expression is more reliable than dual dense crons on free runners
    # (GitHub may delay or skip schedules under load — lag check self-heals)
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # Allow lag-check / external cron to kick a run without sharing the schedule queue
  repository_dispatch:
    types: [refresh-bwt]

# Fetch CBP every run. Commit + deploy Pages only when the XML changed.
# GITHUB_TOKEN pushes do not trigger other workflows.

permissions:
  contents: write
  pages: write
  id-token: write

# Own group so a code-only Pages deploy cannot queue/block data refresh for hours
concurrency:
  group: bwt-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CBP Brownsville feed
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p data
          # Retry CBP a few times (occasional blips)
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 2 --retry-delay 2 \
              "https://bwt.cbp.gov/api/bwtRss/HTML/44,43/42,45,44,43/42,45,43" \
              -o data/bwt.xml; then
              if grep -q "<item>" data/bwt.xml; then
                ok=1
                break
              fi
            fi
            echo "Attempt $i failed; retrying…"
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "Failed to fetch a valid CBP feed"
            exit 1
          fi
          echo "Feed size: $(wc -c < data/bwt.xml) bytes"
          echo "pubDate: $(grep -o '<pubDate>[^<]*' data/bwt.xml | head -1)"
          echo "Sample times:"
          grep -oE 'At [0-9:]+ [ap]m C[DS]T|[0-9]+ min delay|Update Pending' data/bwt.xml | head -20

          # last-fetch.txt used to change every run and force a commit even when
          # wait times were identical — that produced hundreds of empty history entries.
          if git diff --quiet -- data/bwt.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Feed unchanged; skip commit and Pages deploy."
          else
            date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last-fetch.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Feed changed; will commit and deploy."
          fi

      - name: Commit updated data (if changed)
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bwt.xml data/last-fetch.txt
          git commit -m "chore: refresh Brownsville CBP wait times"
          git push
          echo "Committed and pushed new data/bwt.xml"

      - name: Stage site files
        if: steps.fetch.outputs.changed == 'true'
        run: |
          mkdir -p _site/data _site/icons
          cp index.html README.md manifest.webmanifest sw.js _site/
          cp icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png _site/icons/
          cp data/bwt.xml _site/data/bwt.xml
          cp data/last-fetch.txt _site/data/last-fetch.txt 2>/dev/null || true
          touch _site/.nojekyll
          echo "Deploying feed:"
          grep -o '<pubDate>[^<]*' _site/data/bwt.xml | head -1
          grep -oE 'At [0-9:]+ [ap]m C[DS]T' _site/data/bwt.xml | sort | uniq -c | head -5

      - name: Configure Pages
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.fetch.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Nothing to publish
        if: steps.fetch.outputs.changed != 'true'
        run: echo "CBP feed matches the last committed mirror. Job succeeds without a deploy."
