    .topbar a { color: #7dd3fc; text-decoration: none; font-weight: 650; }
    .topbar a:hover { text-decoration: underline; }
    .seg {
      display: inline-flex;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      overflow: hidden;
    }
    .seg button {
      appearance: none;
      border: none;
      background: transparent;
      color: #94a3b8;
      font: inherit;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0.22rem 0.55rem;
      cursor: pointer;
    }
    .seg button.active { background: #fff; color: var(--navy); }
    .icon-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,.2);
      background: transparent;
      color: #e2e8f0;
      border-radius: 999px;
      width: 32px;
      height: 32px;
      cursor: pointer;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.1rem 1rem 2.5rem;

      font-size: clamp(1.6rem, 4vw, 2.2rem);

      margin: 0.35rem 0 0.25rem;
    }
    .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem; }
    .panel {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);

      margin-bottom: 0.85rem;

    .pill.dist { color: var(--sky-deep); border-color: #bae6fd; background: #e0f2fe; }

    .pill.tz { color: var(--sky-deep); }
    .port-hours,

      font-size: 0.75rem;

      letter-spacing: 0.01em;
      color: var(--muted);
      margin-top: 0.3rem;
      line-height: 1.3;

      justify-content: center;

      height: 1.35rem;

      border-radius: 6px;
      text-decoration: none;

    }

      width: 0.95rem;
      height: 0.95rem;
      display: block;

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.45rem;
      margin-top: 0.65rem;
    }
    .cell {
      background: linear-gradient(180deg, var(--line-soft) 0%, var(--white) 55%);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.5rem 0.55rem 0.55rem;
      min-width: 0;
    }
    .cell-kicker {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .wait { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }

    .cell-asof {
      margin-top: 0.2rem;

      color: var(--muted);

    .dual-label { font-size: 0.62rem; font-weight: 800; color: var(--muted); text-transform: none; margin-right: 0.2rem; }
    .empty { text-align: center; color: var(--muted); padding: 1.5rem 0.5rem; }

      font-size: 0.8rem;
      font-weight: 700;

      border-radius: 999px;

      margin: 0.5rem auto 0;
      box-shadow: var(--shadow-sm);

    .hero-block { margin-bottom: 0.85rem; }
    @media (max-width: 720px) {
      .port-grid { grid-template-columns: 1fr; }

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a id="backLink" href="../">← Brownsville wait times</a>
      <div style="display:flex;gap:.4rem;align-items:center;">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" id="langEn" class="active">EN</button>
          <button type="button" id="langEs">ES</button>
        </div>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button>
      </div>
    </div>
  </div>

  <main class="wrap">
    <header class="hero-block">
      <h1 id="pageTitle">All U.S. land ports</h1>
      <p class="sub" id="pageSub">Live CBP wait times · nearest to you, with optional filters</p>
    </header>

    <section class="panel">
      <div class="row">
        <div class="filter-asof">
          <div class="seg-lite" role="group" aria-label="View mode">
            <button type="button" data-view="nearest" class="active">Nearest</button>
            <button type="button" data-view="browse">Browse</button>
          </div>
          <div class="seg-lite" role="group" aria-label="Traffic type">
            <button type="button" data-traffic="all" class="active">All</button>
            <button type="button" data-traffic="passenger">Vehicles</button>
            <button type="button" data-traffic="pedestrian">Pedestrian</button>
            <button type="button" data-traffic="commercial">Commercial</button>
          </div>
          <div class="asof"><span id="latestLabel">Latest report:</span> <strong id="asofStamp">—</strong></div>
        </div>
      </div>
      <div class="row">
        <select id="filterBorder" aria-label="Border">
          <option value="all">All borders</option>
          <option value="mexican">Mexico</option>
          <option value="canadian">Northern</option>
        </select>
        <select id="filterState" aria-label="State">
          <option value="all">All states</option>
        </select>
        <select id="filterPort" aria-label="Port">
          <option value="all">All ports</option>
        </select>
      </div>
    </section>

    <p class="status" id="statusLine">Loading all ports…</p>
    <div class="meta-row">
      <span id="resultCount"></span>
    </div>
    <div id="portGrid" aria-live="polite"></div>
    <button type="button" id="showMoreBtn" hidden>Show more</button>
  </main>

  <script src="port-meta.js"></script>
  <script src="all-ports.js?v=19"></script>
</body>
</html>
